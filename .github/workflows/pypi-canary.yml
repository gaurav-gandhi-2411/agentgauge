name: PyPI Canary

# Daily check that the PUBLISHED package (not the repo source) still installs and runs cleanly
# in an isolated environment -- this is the check that would have caught the mcp 2.0.0 break
# within a day instead of two (see the v0.5.1 release notes / commit 0ea0052). Deliberately does
# NOT `actions/checkout` the repo for the smoke-test fixtures below (the embedded server/tasks
# are self-contained) so this workflow tests only what `pip install agentgauge-harness` actually
# resolves right now, decoupled from any future change to examples/ or README.md in this repo.

on:
  schedule:
    - cron: "17 6 * * *" # ~daily, arbitrary time chosen to avoid the top-of-hour GH Actions rush
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Force a failure to test the issue-opening path (does not touch PyPI)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install agentgauge-harness from PyPI (clean environment, no local source)
        run: python -m pip install --no-cache-dir agentgauge-harness

      - name: agentgauge --version
        run: agentgauge --version

      # Self-contained fixtures mirroring examples/echo_server.py's public shape -- deliberately
      # NOT checked out from the repo, so this workflow stays independent of any future change
      # there and tests only the installed package.
      - name: Write quickstart fixtures
        run: |
          cat > echo_server.py <<'PYEOF'
          from __future__ import annotations
          import asyncio
          import mcp.types as types
          from mcp.server import Server
          from mcp.server.models import InitializationOptions
          from mcp.server.stdio import stdio_server

          server = Server("echo-canary")

          @server.list_tools()
          async def list_tools() -> list[types.Tool]:
              return [
                  types.Tool(
                      name="echo",
                      description="Echo a message back to the caller.",
                      inputSchema={
                          "type": "object",
                          "properties": {"message": {"type": "string", "description": "Text to echo"}},
                          "required": ["message"],
                      },
                  )
              ]

          @server.call_tool()
          async def call_tool(name: str, arguments: dict) -> list[types.TextContent]:
              if name == "echo":
                  return [types.TextContent(type="text", text=arguments["message"])]
              raise ValueError(f"Unknown tool: {name}")

          async def main() -> None:
              async with stdio_server() as (read_stream, write_stream):
                  await server.run(
                      read_stream,
                      write_stream,
                      InitializationOptions(
                          server_name="echo-canary",
                          server_version="0.1.0",
                          capabilities=server.get_capabilities(
                              notification_options=None, experimental_capabilities={}
                          ),
                      ),
                  )

          if __name__ == "__main__":
              asyncio.run(main())
          PYEOF
          cat > tasks.json <<'JSONEOF'
          [
            {
              "tool_name": "echo",
              "description": "Repeat the phrase 'hello world' back to me exactly.",
              "constraints": [{"param": "message", "kind": "enum", "gold_value": "hello world"}]
            }
          ]
          JSONEOF

      - name: agentgauge lint (zero-LLM quickstart step)
        run: agentgauge lint echo_server.py

      # --mock: no live inference on this runner (no paid provider, no local Ollama available).
      - name: agentgauge diff --mock
        run: agentgauge diff echo_server.py echo_server.py --tasks tasks.json --mock

      - name: agentgauge attribute (experimental gate must still refuse cleanly)
        run: |
          set +e
          agentgauge attribute
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit code 1 (refused without --experimental), got $code"
            exit 1
          fi

      - name: Simulate failure (workflow_dispatch only, for testing the issue-opening path)
        if: github.event.inputs.simulate_failure == 'true'
        run: |
          echo "Deliberately failing -- simulate_failure=true was passed to workflow_dispatch."
          exit 1

      - name: Find existing open canary-failure issue
        if: failure()
        id: existing
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label pypi-canary-failure \
            --state open --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Open or update an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="The PyPI canary failed: a clean \`pip install agentgauge-harness\` + quickstart \
          did not complete successfully. This is the published-package check -- it does not \
          depend on repo source state.

          Run: $RUN_URL
          Triggered: ${{ github.event_name }}

          This is exactly the class of failure that broke v0.4.0 and v0.5.0 silently for two \
          days (an unbounded dependency resolving to a breaking release) -- see \
          reports/v0_5_probe_power_fix.md's sibling incident writeup in the v0.5.1 release notes."
          if [ -n "${{ steps.existing.outputs.number }}" ]; then
            gh issue comment "${{ steps.existing.outputs.number }}" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "PyPI canary failed: clean install/quickstart broken" \
              --label pypi-canary-failure \
              --body "$BODY"
          fi

      - name: Close stale canary-failure issue on recovery
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label pypi-canary-failure \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body "Canary passed on the next scheduled run -- closing. Re-opens automatically if it fails again."
            gh issue close "$number" --repo "$GITHUB_REPOSITORY"
          fi
