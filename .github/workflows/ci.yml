name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv --quiet

      - name: Run verify.sh
        run: bash scripts/verify.sh

  # `verify` runs the suite on 3.11, which is the floor (requires-python >=3.11), while the classifiers
  # also claim 3.12 and 3.13. tracegauge shipped three releases that did not import on its floor because
  # CI only ran one version (found 2026-10-07); here the floor IS the tested version, so this closes the
  # other direction: the claimed versions above it. A SEPARATE job, not a matrix on `verify`, because
  # renaming that job's check would orphan the required check "verify" and block every merge. Covered
  # by the required aggregate check "python-compat (every leg)" below.
  python-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv --quiet

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Unit tests
        run: uv run pytest tests/ -v

  # One check that is red if ANY python-compat leg is red. Legs are named "python-compat (3.12)" etc.;
  # requiring each by name would go stale the day a version is added or dropped, and a leg that is not
  # required cannot block a merge (adk-tracegauge found this on its first bot-opened PR, 2026-10-08:
  # every required check green, a new leg red, the merge gate "eligible"). This name is stable, so it
  # can be a required check that covers every leg, present and future.
  python-compat-all:
    name: python-compat (every leg)
    if: ${{ always() }}
    needs: [python-compat]
    runs-on: ubuntu-latest
    steps:
      - name: Every python-compat leg passed
        env:
          COMPAT_RESULT: ${{ needs.python-compat.result }}
        run: |
          echo "python-compat (all legs): $COMPAT_RESULT"
          [ "$COMPAT_RESULT" = "success" ]

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check commit hygiene — no claude.ai session URLs or Co-authored-by Claude trailers
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            RANGE="origin/main..HEAD"
          else
            # Push to main: check only the newly pushed commit(s).
            BEFORE="${{ github.event.before }}"
            SHA="${{ github.sha }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              RANGE="HEAD^..HEAD"
            else
              RANGE="$BEFORE..$SHA"
            fi
          fi
          MSGS=$(git log "$RANGE" --format='%B' 2>/dev/null || git log -1 --format='%B')
          if echo "$MSGS" | grep -qF 'claude.ai/code/session'; then
            echo "ERROR: commit message contains a claude.ai/code/session URL — remove it before merging"
            exit 1
          fi
          if echo "$MSGS" | grep -iqF 'co-authored-by: claude'; then
            echo "ERROR: commit message contains a Co-authored-by: Claude trailer — remove it before merging"
            exit 1
          fi
          echo "OK: commit hygiene verified"
          echo "RANGE=$RANGE" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check docs/paper/paper.md and docs/paper/latex/ stay in sync
        run: python3 scripts/check_paper_latex_sync.py "$RANGE"

      - name: Check every .bib entry carries a verification marker
        run: python3 scripts/check_bib_verified.py

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv --quiet

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run pip-audit
        # Blocking (v0.5.2+): pip-audit was brought to 0 findings and every direct dependency
        # now has an upper bound (chore/dependency-hardening) -- a new CVE surfacing here is a
        # real regression that should fail CI, not a permanent baseline noise to suppress.
        run: uv run --with pip-audit pip-audit

  manifest-provenance:
    # 2026-08-05 audit: a metric in .portfolio/metrics.json without a
    # committed artifact behind it can silently drift from what the portfolio
    # site shows, with nobody able to tell -- this is a build failure, not a
    # warning. See gg-portfolio's provenance.md wave 19 section.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Every manifest metric must have a committed artifact
        run: python scripts/check_manifest_provenance.py
