[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentgauge"
version = "0.4.0"
description = "Statistical regression harness for MCP tool descriptions (measures whether a change actually moved agent task success) + a deterministic defect linter as a secondary utility"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Gaurav Gandhi", email = "gaurav.gandhi2411@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.3.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "rich>=13.0.0",
    "pydantic>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/gaurav-gandhi-2411/agentgauge"
Repository = "https://github.com/gaurav-gandhi-2411/agentgauge"
Issues = "https://github.com/gaurav-gandhi-2411/agentgauge/issues"
Changelog = "https://github.com/gaurav-gandhi-2411/agentgauge/blob/main/README.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "respx>=0.21.0",
]

[project.scripts]
agentgauge = "agentgauge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["agentgauge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=agentgauge --cov-report=term-missing"

[tool.coverage.report]
fail_under = 60
omit = ["tests/*", "examples/*", "scripts/*"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
